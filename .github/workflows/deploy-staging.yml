# Builds the site from the `staging` branch and publishes it to GitHub Pages:
# https://www.sidhantsardar.com/drbhimraoambedkar.info/ (the account's GitHub Pages custom domain)
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.sidhantsardar.com
      BASE_PATH: /drbhimraoambedkar.info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Second copy of the site with the experimental "AI SaaS" skin, served at /preview-ai/
      - name: Build AI skin preview
        run: |
          mv dist dist-main
          rm -rf .astro node_modules/.astro
          BASE_PATH=/drbhimraoambedkar.info/preview-ai PUBLIC_SKIN=ai npm run build
          mv dist dist-main/preview-ai
          mv dist-main dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
