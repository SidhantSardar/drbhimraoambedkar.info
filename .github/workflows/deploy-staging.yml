# Builds the site from the `staging` branch and publishes it to GitHub Pages:
# https://prabuddhapathak.com/ (the repository's GitHub Pages custom domain)
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://prabuddhapathak.com
      BASE_PATH: /
      PUBLIC_SKIN: light
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The earlier warm-paper (Godna) design, kept for reference at /preview-classic/ (noindex: not for search engines)
      - name: Build classic design preview
        run: |
          mv dist dist-main
          rm -rf .astro node_modules/.astro
          BASE_PATH=/preview-classic PUBLIC_SKIN= PUBLIC_NOINDEX=1 SKIP_MARATHI=1 npm run build
          mv dist dist-main/preview-classic
          mv dist-main dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
