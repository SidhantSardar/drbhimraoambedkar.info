# Builds the site from the `staging` branch and publishes it to GitHub Pages:
# https://prabuddhapathak.com/ (the repository's GitHub Pages custom domain)
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://prabuddhapathak.com
      BASE_PATH: /
      PUBLIC_SKIN: light
      # Google Analytics 4: property "Prabuddha Pathak" in the Sidhant Sardar account, web stream for
      # prabuddhapathak.com. Counted only with the visitor's consent (src/components/Analytics.astro); the
      # noindex classic preview below never loads it.
      PUBLIC_GA_ID: G-X1SNDMVJ7N
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The earlier warm-paper (Godna) design, kept for reference at /preview-classic/ (noindex: not for search engines)
      # It links to the main site's /pdf/ (PUBLIC_PDF_BASE) and drops its own copy, which would add 264 MB under the 1 GB Pages limit.
      - name: Build classic design preview
        run: |
          mv dist dist-main
          rm -rf .astro node_modules/.astro
          BASE_PATH=/preview-classic PUBLIC_SKIN= PUBLIC_NOINDEX=1 SKIP_MARATHI=1 PUBLIC_PDF_BASE=/ npm run build
          rm -rf dist/pdf
          mv dist dist-main/preview-classic
          mv dist-main dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
