# Refreshes src/data/news.json from the feeds in src/data/news-feeds.json,
# commits it to the staging branch, and redeploys staging.
# Paused: the news page is switched off (SHOW_NEWS in src/lib/site.ts) until each story is reviewed
# before it is published. To restart, add back `schedule: - cron: '17 */6 * * *'` under `on:`.
# When the production site is live, add `main` to the branch list below.
name: Update news

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  news:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [staging]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-news.mjs
        env:
          # Optional: add this repository secret to turn on AI news summaries.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/news.json src/data/news-summaries.json 2>/dev/null && [ -z "$(git status --porcelain src/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/news.json src/data/news-summaries.json 2>/dev/null || git add src/data/news.json
            git commit -m "Update news"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy staging
        if: steps.commit.outputs.changed == 'true' && matrix.branch == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-staging.yml --ref staging
